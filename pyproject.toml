[project]
name = "alms-tooling"
version = "0.1.0"
description = "Development tooling configuration for the ALMS workspace"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
	"ruff>=0.6.0",
	"mypy>=1.11.0",
	"pytest>=8.2.0",
	"bandit>=1.7.9",
	"defusedxml>=0.7.1",
	"pip-audit>=2.7.3",
	"radon>=6.0.1",
	"vulture>=2.11",
	"pre-commit>=3.8.0",
]

[tool.ruff]
line-length = 100
extend-exclude = [
	".git",
	".venv",
	"venv",
	"build",
	"dist",
	"reports",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C90", "RUF"]
ignore = ["E402", "E501", "B904", "B008"]

[tool.ruff.lint.mccabe]
max-complexity = 40

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
strict_optional = true
ignore_missing_imports = true
exclude = [
	"^build/",
	"^dist/",
	"^reports/",
	'^\.venv/',
	"^venv/",
]
