name: Arrow Limousine CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r modern_backend/requirements.txt
        pip install ruff pytest httpx pytest-asyncio

    - name: Lint (ruff)
      run: |
        ruff check modern_backend

    - name: Run tests
      run: |
        python -m pytest modern_backend/tests -c /dev/null -o asyncio_mode=auto -q
