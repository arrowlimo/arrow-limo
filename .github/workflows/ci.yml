name: Arrow Limousine CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:12
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: almsdata_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov psycopg2-binary
    
    - name: Set up test database
      env:
        PGPASSWORD: postgres
      run: |
        psql -h localhost -U postgres -d almsdata_test -f schema.sql
    
    - name: Run tests
      env:
        DB_HOST: localhost
        DB_NAME: almsdata_test
        DB_USER: postgres
        DB_PASSWORD: postgres
      run: |
        pytest tests/ --cov=desktop_app --cov=scripts --cov-report=xml
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  deep_scan:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install deep scan tooling
      run: |
        python -m pip install --upgrade pip
        pip install ruff mypy bandit pip-audit radon vulture

    - name: Ruff
      run: ruff check modern_backend

    - name: MyPy
      run: mypy modern_backend/app

    - name: Bandit
      run: bandit -r modern_backend/app -ll

    - name: Pip Audit
      run: pip-audit

    - name: Radon Complexity
      run: radon cc modern_backend/app/routers -s -n C

    - name: Vulture Dead Code
      run: vulture modern_backend/app --min-confidence 80
