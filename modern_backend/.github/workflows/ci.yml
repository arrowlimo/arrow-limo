name: CI
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r modern_backend/requirements.txt
          pip install ruff bandit mypy pytest httpx pytest-asyncio
      - name: Lint
        run: |
          ruff check modern_backend/app
      - name: Security checks
        run: |
          bandit -q -r modern_backend/app -ll -x modern_backend/tests
      - name: Type check
        run: |
          mypy modern_backend || true
      - name: Test
        run: |
          pytest -q || true

  docker:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: |
          docker build -f Dockerfile -t limo-modern-backend:ci .
