services:
  - type: web
    name: arrow-limo
    runtime: python
    pythonVersion: 3.11

    buildCommand: |
      pip install --upgrade pip setuptools wheel
      pip install -r modern_backend/requirements.txt
      cd frontend && npm install && npm run build && cd ..

    startCommand: |
      uvicorn modern_backend.app.main:app \
        --host 0.0.0.0 \
        --port $PORT \
        --workers 4

    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSLMODE
        value: require
      - key: DB_CHANNEL_BINDING
        value: require
      - key: DB_PORT
        value: "5432"

      - key: ALMS_DEFAULT_DB_TARGET
        value: neon
      - key: ALMS_ENABLE_CLOUD_LOGIN
        value: "1"
      - key: ALMS_ENABLE_WEB_LOGIN
        value: "1"
      - key: AUTO_LOGIN
        value: "false"
      - key: API_HOST
        value: 0.0.0.0
      - key: API_PORT
        value: $PORT
      - key: ENVIRONMENT
        value: production
      - key: TRUSTED_HOSTS
        value: arrow-limo.onrender.com
      - key: CORS_ORIGINS
        value: https://arrow-limo.onrender.com
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: "0.05"
      - key: VUE_APP_SENTRY_DSN
        sync: false
      - key: VUE_APP_SENTRY_TRACES_SAMPLE_RATE
        value: "0.05"
      - key: VUE_APP_ENVIRONMENT
        value: production
      - key: LOG_REQUESTS
        value: "true"
      - key: SECURITY_HEADERS_ENABLED
        value: "true"
      - key: RATE_LIMIT_REQUESTS
        value: "120"
      - key: AUTH_RATE_LIMIT_REQUESTS
        value: "10"
      - key: RATE_LIMIT_WINDOW_SECONDS
        value: "60"

      - key: SESSION_TIMEOUT_MINUTES
        value: "30"
      - key: MAX_LOGIN_ATTEMPTS
        value: "5"
      - key: LOGIN_LOCKOUT_MINUTES
        value: "15"

      - key: SQUARE_ACCESS_TOKEN
        sync: false
      - key: SQUARE_ENV
        value: production

    healthCheckPath: /health

    disk:
      name: data
      mountPath: /data
      sizeGB: 10

    plan: starter

    autoDeployOnPush: true
    autoDeploy:
      branch: main

    buildCache: true
    logDrains: []

# Database connection values are configured privately in Render.
